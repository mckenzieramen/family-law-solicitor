<div id="app"></div>
<script>
const tabs=['Overview','My Matters','Review Queue','Financial Disclosure','Calendar','Legal Assistant Duties'];
const records=[
 {id:'D-01',title:'Assets & liabilities schedule',matter:'M-014',body:'Draft schedule for property settlement. Supporting records include the sample mortgage statement and asset register. The outstanding bank statement is marked as requested.',status:'For review'},
 {id:'D-02',title:'Client follow-up letter',matter:'M-014',body:'Draft follow-up requesting the remaining bank statement. The assistant has recorded the preferred contact method in the sample matter.',status:'For review'},
 {id:'D-03',title:'Hearing brief index',matter:'M-028',body:'Draft index with hearing details, chronology, correspondence and a list of attachments for solicitor review.',status:'For review'}
];
const matters={'M-014':'Property settlement','M-028':'Parenting arrangements'};
const app=document.querySelector('#app');
const entry=document.querySelector('#entry');
let tab='Overview',selected='D-01',matter='M-014',notice='';
function load(){try{return JSON.parse(localStorage.getItem('solicitor-demo-v1'))||{}}catch{return {}}}
const saved=load();
const decisions=saved.decisions||{};
const instructions=saved.instructions||{};
const dutyGroups = [
 {id:'legal', title:'Legal Administration', duties:[
  'Prepare, format and proofread legal correspondence and documents.',
  'Assist with drafting letters, emails and court documents using templates and solicitor instructions.',
  'Prepare briefs and organise documents for court hearings.',
  'Manage electronic client files and maintain accurate records.'
 ]},
 {id:'family', title:'Family Law Support', duties:[
  'Assist with the preparation of financial disclosure documents.',
  'Review, sort and organise bank statements, tax returns, payslips and superannuation records.',
  'Create schedules of assets, liabilities and financial information.',
  'Conduct preliminary legal research and case law searches under supervision.'
 ]},
 {id:'admin', title:'Administrative Support', duties:[
  'Liaise with clients professionally and courteously.',
  'Schedule appointments, meetings and court dates.',
  'Follow up with clients for outstanding documents and information.',
  'Maintain file management systems, electronic databases and archives.',
  'Carry out general administrative duties as required.'
 ]}
];
const completedDuties = new Set(Array.isArray(saved.completedDuties) ? saved.completedDuties : []);

function assistantDuties(){
 return '<div class="duty-groups">' + dutyGroups.map(group => {
  const count = group.duties.filter((_, index) => completedDuties.has(group.id + '-' + index)).length;
  return '<fieldset class="card duty-group"><legend>' + group.title +
   '</legend><p class="muted" data-duty-count="' + group.id + '" role="status">' + count + ' of ' + group.duties.length + ' complete</p>' +
   group.duties.map((duty,index) => {
    const id = group.id + '-' + index;
    return '<label class="duty-item"><input type="checkbox" data-duty="' + id + '"' +
     (completedDuties.has(id) ? ' checked' : '') + '><span>' + duty + '</span></label>';
   }).join('') + '</fieldset>';
 }).join('') + '</div>';
}
function persist(){try{localStorage.setItem('solicitor-demo-v1',JSON.stringify({decisions,instructions,completedDuties:[...completedDuties]}));return true}catch{return false}}
const status=r=>decisions[r.id]?.status||r.status;
const dates=()=>[
 ['Client consultation','M-014','23 November 2026, 10:00 am'],
 ['Disclosure deadline','M-014','26 November 2026, 5:00 pm'],
 ['Court hearing','M-028','2 December 2026, 9:30 am']
].map(([name,id,time])=>'<li><strong>'+name+'</strong> · '+id+'<br><span class="muted">'+time+'</span></li>').join('');
function queue(){
 const record=records.find(r=>r.id===selected);
 return '<div class="split"><section class="card"><h2>Documents</h2>'+records.map(r=>'<button class="item" data-doc="'+r.id+'" aria-pressed="'+(r.id===selected)+'"><span><strong>'+r.title+'</strong><br><small>'+r.matter+'</small></span><span class="status" data-state="'+status(r)+'">'+status(r)+'</span></button>').join('')+'</section><section class="card"><h2>'+record.title+'</h2><span class="status" data-state="'+status(record)+'">'+status(record)+'</span><p class="note">'+escapeHtml(record.body)+'</p><p id="previous-comment"></p>'+(status(record)==='For review'?'<form id="review"><label for="comment">Review comments</label><textarea id="comment" maxlength="1500"></textarea><div class="actions"><button class="action" value="Approved for next step">Approve draft</button><button class="secondary" value="Returned to assistant">Return with comments</button></div></form>':'')+'</section></div>';
}
function content(){
 switch(tab){
 case 'Legal Assistant Duties': return assistantDuties();
 case 'Overview': return '<div class="cards"><div class="card"><span class="metric">'+records.filter(r=>status(r)==='For review').length+'</span>Drafts for review</div><div class="card"><span class="metric">2</span>Assigned matters</div><div class="card"><span class="metric">3</span>Upcoming dates</div></div>'+queue();
 case 'Review Queue': return queue();
 case 'My Matters': return '<div class="split"><section class="card"><h2>Assigned matters</h2>'+Object.entries(matters).map(([id,name])=>'<button class="item" aria-pressed="'+(id===matter)+'" data-matter="'+id+'">'+id+' · '+name+'</button>').join('')+'</section><section class="card"><h2>'+matters[matter]+'</h2><p class="muted">'+matter+'</p><h3>Linked documents</h3>'+records.filter(r=>r.matter===matter).map(r=>'<button class="item" data-open="'+r.id+'">'+r.title+'</button>').join('')+'<form id="instruction"><label for="instructions">Instructions for the legal assistant</label><textarea id="instructions" maxlength="1500" required></textarea><button class="action">Save instructions</button></form></section></div>';
 case 'Financial Disclosure': return '<section class="card"><h2>M-014 · Property settlement</h2><p>Supporting records for the sample assets and liabilities schedule.</p><ul><li>Mortgage statement · Received</li><li>Asset register · Received</li><li>Bank statement · Requested</li></ul><button class="action" data-open="D-01">Review assets & liabilities schedule</button></section>';
 case 'Calendar': return '<section class="card"><h2>Upcoming dates</h2><p class="muted">Sydney time</p><ul>'+dates()+'</ul></section>';
 }
}
function workspace(){
 entry.hidden=false;

 <section id="resources" class="client-section client-faq"><h2>Frequently asked questions</h2><details name="client-faq"><summary>What happens during a separation?</summary><p>Separation can raise important legal, financial and parenting considerations. You do not need to be divorced to resolve your property or parenting arrangements. We can advise you on your legal rights and obligations, assist with negotiations and help you understand the steps involved in reaching a practical and legally appropriate outcome. Every separation is different, and obtaining early legal advice can help you make informed decisions about your future.</p></details><details name="client-faq"><summary>How is property divided after separation?</summary><p>There is no automatic 50/50 division of assets following separation. Property settlements are determined by considering the circumstances of each relationship and what outcome is just and equitable. This involves identifying the parties’ assets, liabilities and financial resources, assessing their financial and non-financial contributions, and considering their current and future circumstances. We assist clients with property settlements involving real estate, businesses, superannuation, investments, inheritances and other financial interests.</p></details><details name="client-faq"><summary>Do I need to be divorced before finalising a property settlement?</summary><p>No. You can negotiate and formalise a property settlement without obtaining a divorce. In fact, many separating couples resolve their financial arrangements before formally divorcing. However, it is important to understand the applicable time limits. Generally, married couples have 12 months from the date their divorce becomes final to commence property proceedings in court. We can advise you on the options available to formalise your financial arrangements and protect your interests.</p></details><details name="client-faq"><summary>How are parenting arrangements determined?</summary><p>Parenting arrangements should prioritise the best interests, safety and wellbeing of the child. There is no automatic presumption that children must spend equal time with each parent. Each family’s circumstances are different, and arrangements should reflect the child’s individual needs, including their developmental, emotional and practical needs. We assist parents with parenting negotiations, parenting plans, consent orders and court proceedings where an agreement cannot be reached.</p></details><details name="client-faq"><summary>What happens if my former partner refuses to cooperate?</summary><p>A former partner’s refusal to cooperate does not mean that your matter cannot progress. There are various options available, including solicitor-led negotiations, family dispute resolution and, where necessary, court proceedings. We can help you understand your options, communicate with the other party or their legal representative, and take appropriate steps to progress your matter while protecting your legal interests.</p></details><details name="client-faq"><summary>How much does it cost to engage a family lawyer?</summary><p>The cost of engaging a family lawyer depends on the nature, complexity and circumstances of your matter. Some matters can be resolved through negotiation or mediation, while others may require extensive preparation and court representation. At Prevail Family Law, we aim to provide transparent information about legal costs from the outset. We will discuss the anticipated work involved, our professional fees and the available options so that you can make an informed decision before proceeding.</p></details><details name="client-faq"><summary>Can my matter be resolved without going to court?</summary><p>Yes. Many family law matters can be resolved without commencing court proceedings. Depending on your circumstances, this may involve solicitor-led negotiations, mediation or family dispute resolution. If an agreement is reached, it may be formalised through legally binding consent orders or, where appropriate, a financial agreement. Our approach is to explore practical and cost-effective resolution options wherever possible, while ensuring you understand your legal rights and the options available if negotiations are unsuccessful.</p></details><details name="client-faq"><summary>What if there has been domestic or family violence?</summary><p>Family violence is a serious matter and can have significant implications for parenting arrangements and, where relevant, property settlements. The family law system recognises that family violence may include physical, emotional, psychological, sexual and financial abuse, as well as coercive and controlling behaviour. Your safety and the safety of your children are important. We can provide advice about available legal protections, parenting arrangements and the potential financial implications of family violence. If you are in immediate danger, contact emergency services on 000.</p></details><details name="client-faq"><summary>Am I entitled to spousal maintenance after separation?</summary><p>Depending on your circumstances, you may be entitled to receive spousal maintenance or may have an obligation to financially support your former partner. The Court generally considers whether one party is unable to adequately support themselves and whether the other party has the capacity to provide financial assistance. Relevant considerations may include income, earning capacity, age, health, financial commitments and the care of children. We can assess your circumstances and advise you about whether a spousal maintenance application or agreement may be appropriate.</p></details><details name="client-faq"><summary>How long does a family law matter take to resolve?</summary><p>The time required to resolve a family law matter depends on its complexity, the level of cooperation between the parties and whether court proceedings are necessary. Some matters can be resolved relatively quickly through negotiation or mediation, while contested property and parenting proceedings may take considerably longer. Our focus is on identifying the most appropriate pathway for your circumstances, keeping you informed throughout the process and working towards a timely and practical resolution.</p></details></section>

 const heroVideo=app.querySelector('#home-hero-video');
 if(heroVideo){
  const motionPreference=window.matchMedia('(prefers-reduced-motion: reduce)');
  const saveData=navigator.connection?.saveData===true;
  let inViewport=true;
  const syncHeroVideo=()=>{
   const shouldPlay=!document.hidden&&inViewport&&!motionPreference.matches&&!saveData;
   if(shouldPlay&&heroVideo.paused){
    heroVideo.playbackRate=0.8;
    heroVideo.play().catch(()=>{});
   }else if(!shouldPlay&&!heroVideo.paused)heroVideo.pause();
  };
  motionPreference.addEventListener?.('change',syncHeroVideo);
  document.addEventListener('visibilitychange',syncHeroVideo);
  if('IntersectionObserver' in window){
   const videoObserver=new IntersectionObserver(([entry])=>{
    inViewport=entry.isIntersecting;
    syncHeroVideo();
   },{threshold:0.08});
   videoObserver.observe(heroVideo);
  }else syncHeroVideo();
 }

}

app.addEventListener('click',event=>{
 const button=event.target.closest('button[data-tab],button[data-doc],button[data-matter],button[data-open]');
 if(!button)return;
 notice='';
 if(button.dataset.tab)tab=button.dataset.tab;
 if(button.dataset.doc)selected=button.dataset.doc;
 if(button.dataset.matter)matter=button.dataset.matter;
 if(button.dataset.open){tab='Review Queue';selected=button.dataset.open}
 workspace();
});
app.addEventListener('submit',event=>{
 if(!['review','instruction'].includes(event.target.id))return;
 event.preventDefault();
 if(event.target.id==='review'){
  const comment=app.querySelector('#comment').value.trim();
  const decision=event.submitter?.value;
  if(!decision)return;
  if(decision==='Returned to assistant'&&!comment){const field=app.querySelector('#comment');field.setCustomValidity('Enter comments before returning this draft.');field.reportValidity();return}
  decisions[selected]={status:decision,comment};
  notice=persist()?decision+' in this demo.':decision+' for this session only.';
 }
 if(event.target.id==='instruction'){
  const field=app.querySelector('#instructions');
  if(!field.value.trim()){field.setCustomValidity('Enter instructions before saving.');field.reportValidity();return}
  instructions[matter]=field.value.trim();
  notice=persist()?'Instructions saved in this demo.':'Instructions saved for this session only.';
 }
 workspace();
});
app.addEventListener('change', event => {
 const checkbox = event.target;
 if (!checkbox.matches('input[data-duty]')) return;
 const id = checkbox.dataset.duty;
 const group = dutyGroups.find(item => id.startsWith(item.id + '-'));
 if (!group) return;
 if (checkbox.checked) completedDuties.add(id);
 else completedDuties.delete(id);
 const count = group.duties.filter((_, index) => completedDuties.has(group.id + '-' + index)).length;
 const savedLocally = persist();
 app.querySelector('[data-duty-count="' + group.id + '"]').textContent =
  count + ' of ' + group.duties.length + ' complete' + (savedLocally ? '' : ' · saved for this session only');
});
app.addEventListener('input',event=>{if(event.target instanceof HTMLTextAreaElement)event.target.setCustomValidity('')});

(() => {
 const selectors = '.client-home a[href="#contact"], .site-header .header-nav a.nav-cta';
 const modal = document.createElement('dialog');
 modal.className = 'consultation-frame-dialog';
 modal.setAttribute('aria-labelledby', 'consultation-dialog-title');
 modal.innerHTML = '<div class="consultation-frame-top"><strong id="consultation-dialog-title">Book a Consultation</strong><button type="button" aria-label="Close booking dialog" class="consultation-frame-close">×</button></div><div class="consultation-frame-body"></div>';
 const body = modal.querySelector('.consultation-frame-body');
 let pageContent = null;
 let anchor = null;
 let opener = null;
 document.body.appendChild(modal);

 const restoreForm = () => {
  if (anchor && pageContent) anchor.replaceWith(pageContent);
  anchor = null;
  pageContent = null;
  if (opener && opener.isConnected) opener.focus();
 };
 modal.querySelector('.consultation-frame-close').addEventListener('click', () => modal.close());
 modal.addEventListener('click', event => {
  if (event.target === modal) modal.close();
 });
 modal.addEventListener('close', restoreForm);

 document.addEventListener('click', event => {
  const link = event.target.closest(selectors);
  if (!link) return;
  const page = document.querySelector('#app .client-home');
  if (!page || modal.contains(page)) return;
  event.preventDefault();
  opener = link;
  pageContent = page;
  anchor = document.createComment('consultation-page-location');
  page.before(anchor);
  body.replaceChildren(page);
  modal.showModal();
  body.scrollTop = 0;
 }, true);
})();
</script>
