<!doctype html>
<html lang="en-AU" class="auth-pending">
<head>
<style id="prevail-auth-transition">
html.auth-pending #staff-entry,html.auth-pending main.staff-entry,html.auth-pending #staff-checklist,html.auth-pending #employee-panel{display:none!important}
#prevail-auth-loader{display:none;position:fixed;inset:0;z-index:2147483647;background:#f5f1eb;align-items:center;justify-content:center;pointer-events:auto}
html.auth-pending #prevail-auth-loader,html.auth-revealing #prevail-auth-loader{display:flex}
#prevail-auth-loader{background:#f7f3ed;color:#101f30}

html.auth-revealing #prevail-auth-loader{animation:prevail-loader-fade .38s ease both;pointer-events:none}
html.auth-revealing #staff-checklist,html.auth-revealing #employee-panel{animation:prevail-workspace-reveal .38s ease both}
@keyframes prevail-loader-fade{from{opacity:1}to{opacity:0}}
@keyframes prevail-workspace-reveal{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#prevail-auth-loader svg,html.auth-revealing #prevail-auth-loader,html.auth-revealing #staff-checklist,html.auth-revealing #employee-panel{animation:none}}
</style>
<script>window.prevailAuthScreen=function(mode){var root=document.documentElement;root.classList.remove('auth-revealing');if(mode==='loading'){root.classList.add('auth-pending');return;}if(mode==='workspace'){root.classList.add('auth-revealing');}root.classList.remove('auth-pending');if(mode==='workspace'){setTimeout(function(){root.classList.remove('auth-revealing');},420);}};</script>
