<script>
const tabs=['Overview','My Matters','Review Queue','Financial Disclosure','Calendar','Legal Assistant Duties'];
const records=[
 {id:'D-01',title:'Assets & liabilities schedule',matter:'M-014',body:'Draft schedule for property settlement. Supporting records include the sample mortgage statement and asset register. The outstanding bank statement is marked as requested.',status:'For review'},
 {id:'D-02',title:'Client follow-up letter',matter:'M-014',body:'Draft follow-up requesting the remaining bank statement. The assistant has recorded the preferred contact method in the sample matter.',status:'For review'},
 {id:'D-03',title:'Hearing brief index',matter:'M-028',body:'Draft index with hearing details, chronology, correspondence and a list of attachments for solicitor review.',status:'For review'}
];
const matters={'M-014':'Property settlement','M-028':'Parenting arrangements'};
const app=document.querySelector('#app');
const entry=document.querySelector('#entry');
let tab='Overview',selected='D-01',matter='M-014',notice='';
function load(){try{return JSON.parse(localStorage.getItem('solicitor-demo-v1'))||{}}catch{return {}}}
const saved=load();
const decisions=saved.decisions||{};
const instructions=saved.instructions||{};
const dutyGroups = [
 {id:'legal', title:'Legal Administration', duties:[
  'Prepare, format and proofread legal correspondence and documents.',
  'Assist with drafting letters, emails and court documents using templates and solicitor instructions.',
  'Prepare briefs and organise documents for court hearings.',
  'Manage electronic client files and maintain accurate records.'
 ]},
 {id:'family', title:'Family Law Support', duties:[
  'Assist with the preparation of financial disclosure documents.',
  'Review, sort and organise bank statements, tax returns, payslips and superannuation records.',
  'Create schedules of assets, liabilities and financial information.',
  'Conduct preliminary legal research and case law searches under supervision.'
 ]},
 {id:'admin', title:'Administrative Support', duties:[
  'Liaise with clients professionally and courteously.',
  'Schedule appointments, meetings and court dates.',
  'Follow up with clients for outstanding documents and information.',
  'Maintain file management systems, electronic databases and archives.',
  'Carry out general administrative duties as required.'
 ]}
];
const completedDuties = new Set(Array.isArray(saved.completedDuties) ? saved.completedDuties : []);

function assistantDuties(){
 return '<div class="duty-groups">' + dutyGroups.map(group => {
  const count = group.duties.filter((_, index) => completedDuties.has(group.id + '-' + index)).length;
  return '<fieldset class="card duty-group"><legend>' + group.title +
   '</legend><p class="muted" data-duty-count="' + group.id + '" role="status">' + count + ' of ' + group.duties.length + ' complete</p>' +
   group.duties.map((duty,index) => {
    const id = group.id + '-' + index;
    return '<label class="duty-item"><input type="checkbox" data-duty="' + id + '"' +
     (completedDuties.has(id) ? ' checked' : '') + '><span>' + duty + '</span></label>';
   }).join('') + '</fieldset>';
 }).join('') + '</div>';
}
function persist(){try{localStorage.setItem('solicitor-demo-v1',JSON.stringify({decisions,instructions,completedDuties:[...completedDuties]}));return true}catch{return false}}
const status=r=>decisions[r.id]?.status||r.status;
const dates=()=>[
 ['Client consultation','M-014','23 November 2026, 10:00 am'],
 ['Disclosure deadline','M-014','26 November 2026, 5:00 pm'],
 ['Court hearing','M-028','2 December 2026, 9:30 am']
].map(([name,id,time])=>'<li><strong>'+name+'</strong> · '+id+'<br><span class="muted">'+time+'</span></li>').join('');
function queue(){
 const record=records.find(r=>r.id===selected);
 return '<div class="split"><section class="card"><h2>Documents</h2>'+records.map(r=>'<button class="item" data-doc="'+r.id+'" aria-pressed="'+(r.id===selected)+'"><span><strong>'+r.title+'</strong><br><small>'+r.matter+'</small></span><span class="status" data-state="'+status(r)+'">'+status(r)+'</span></button>').join('')+'</section><section class="card"><h2>'+record.title+'</h2><span class="status" data-state="'+status(record)+'">'+status(record)+'</span><p class="note">'+escapeHtml(record.body)+'</p><p id="previous-comment"></p>'+(status(record)==='For review'?'<form id="review"><label for="comment">Review comments</label><textarea id="comment" maxlength="1500"></textarea><div class="actions"><button class="action" value="Approved for next step">Approve draft</button><button class="secondary" value="Returned to assistant">Return with comments</button></div></form>':'')+'</section></div>';
}
function content(){
 switch(tab){
 case 'Legal Assistant Duties': return assistantDuties();
 case 'Overview': return '<div class="cards"><div class="card"><span class="metric">'+records.filter(r=>status(r)==='For review').length+'</span>Drafts for review</div><div class="card"><span class="metric">2</span>Assigned matters</div><div class="card"><span class="metric">3</span>Upcoming dates</div></div>'+queue();
 case 'Review Queue': return queue();
 case 'My Matters': return '<div class="split"><section class="card"><h2>Assigned matters</h2>'+Object.entries(matters).map(([id,name])=>'<button class="item" aria-pressed="'+(id===matter)+'" data-matter="'+id+'">'+id+' · '+name+'</button>').join('')+'</section><section class="card"><h2>'+matters[matter]+'</h2><p class="muted">'+matter+'</p><h3>Linked documents</h3>'+records.filter(r=>r.matter===matter).map(r=>'<button class="item" data-open="'+r.id+'">'+r.title+'</button>').join('')+'<form id="instruction"><label for="instructions">Instructions for the legal assistant</label><textarea id="instructions" maxlength="1500" required></textarea><button class="action">Save instructions</button></form></section></div>';
 case 'Financial Disclosure': return '<section class="card"><h2>M-014 · Property settlement</h2><p>Supporting records for the sample assets and liabilities schedule.</p><ul><li>Mortgage statement · Received</li><li>Asset register · Received</li><li>Bank statement · Requested</li></ul><button class="action" data-open="D-01">Review assets & liabilities schedule</button></section>';
 case 'Calendar': return '<section class="card"><h2>Upcoming dates</h2><p class="muted">Sydney time</p><ul>'+dates()+'</ul></section>';
 }
}
function workspace(){
 entry.hidden=false;
 entry.textContent='Exit workspace';
 document.querySelector('.header-nav').hidden=true;
 app.innerHTML='<div class="shell"><nav aria-label="Workspace"><div class="role">Solicitor · Demo</div>'+tabs.map(t=>'<button data-tab="'+t+'" aria-current="'+(t===tab)+'">'+t+'</button>').join('')+'</nav><main><h1>'+ (tab==='Overview'?'Solicitor Workspace':tab)+'</h1><p class="muted">Sample matters and documents · Changes are stored in this browser</p><p role="status" id="notice"></p>'+content()+'</main></div>';
 app.querySelector('#notice').textContent=notice;
 const comment=app.querySelector('#previous-comment');
 if(comment)comment.textContent=decisions[selected]?.comment||'';
 const field=app.querySelector('#instructions');
 if(field)field.value=instructions[matter]||'';
}

 app.innerHTML=`<main class="hero client-home">

  <figure class="hero-photo"><img src="harbour-family-sunset.webp" alt="Illustration of a family overlooking Sydney Harbour at sunset" fetchpriority="high"></figure>
 </section>
 <nav class="premium-quick-links" aria-label="Family law services">
  <a href="#separation"><svg class="ui-icon ui-icon-separation" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="14" r="5"/><circle cx="15" cy="14" r="5"/><path d="m12 3-2 3 2 2 2-2-2-3Z"/></svg><span>Divorce &amp; separation</span></a>
  <a href="#parenting"><svg class="ui-icon ui-icon-parenting" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="8" cy="7" r="3"/><circle cx="17" cy="8.5" r="2.5"/><path d="M2 20v-2a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v2m2-6h1a5 5 0 0 1 5 5v1"/></svg><span>Parenting arrangements</span></a>
  <a href="#property"><svg class="ui-icon ui-icon-property" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 11 9-7 9 7M5 10v10h14V10M10 20v-5h4v5"/></svg><span>Property &amp; finances</span></a>
  <a href="#consent"><svg class="ui-icon ui-icon-consent" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10zm0 0v7h7m-12 5 2 2 5-5"/></svg><span>Consent orders</span></a>
 </nav>
  <section class="premium-journey" aria-labelledby="premium-journey-title">
  <div class="premium-journey-inner">
   <span class="premium-eyebrow">A clear process, at your pace</span>

    <div class="premium-step"><span class="premium-step-number"><svg class="mockup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 4v4m8-4v4M4 11h16m-11 4 2 2 4-4"/></svg></span><h3>Consultation</h3><p>Discuss your questions and priorities with the solicitor.</p></div>
    <div class="premium-step"><span class="premium-step-number"><svg class="mockup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13 3H5v18h14V9Zm0 0v6h6M8 13h8m-8 4h5"/></svg></span><h3>Conflict & engagement checks</h3><p>The firm confirms whether it can act and explains engagement terms.</p></div>
    <div class="premium-step"><span class="premium-step-number"><svg class="mockup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v17M7 21h10M4 7h16M7 7l-4 7h8L7 7Zm10 0-4 7h8l-4-7Z"/></svg></span><h3>Preparation</h3><p>Gather information and documents requested for your matter.</p></div>
    <div class="premium-step"><span class="premium-step-number"><svg class="mockup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 12 4 4L19 6"/></svg></span><h3>Next steps</h3><p>Agree on a plan appropriate to your circumstances.</p></div>
   </div>
  </div>

  <div><h2 id="reference-consultation-title">Book a Consultation</h2><p>Choose your preferred date and time in Sydney.</p></div>
  <a class="action" href="#contact">Check availability</a>

app.addEventListener('click',event=>{const link=event.target.closest('.service-grid h3 a');if(link){const details=document.querySelector(link.getAttribute('href'));if(details)details.open=true}});
app.addEventListener('click',event=>{
 const button=event.target.closest('button[data-tab],button[data-doc],button[data-matter],button[data-open]');
 if(!button)return;
 notice='';
 if(button.dataset.tab)tab=button.dataset.tab;
 if(button.dataset.doc)selected=button.dataset.doc;
 if(button.dataset.matter)matter=button.dataset.matter;
 if(button.dataset.open){tab='Review Queue';selected=button.dataset.open}
 workspace();
});
app.addEventListener('submit',event=>{
 if(!['review','instruction'].includes(event.target.id))return;
 event.preventDefault();
 if(event.target.id==='review'){
  const comment=app.querySelector('#comment').value.trim();
  const decision=event.submitter?.value;
  if(!decision)return;
  if(decision==='Returned to assistant'&&!comment){const field=app.querySelector('#comment');field.setCustomValidity('Enter comments before returning this draft.');field.reportValidity();return}
  decisions[selected]={status:decision,comment};
  notice=persist()?decision+' in this demo.':decision+' for this session only.';
 }
 if(event.target.id==='instruction'){
  const field=app.querySelector('#instructions');
  if(!field.value.trim()){field.setCustomValidity('Enter instructions before saving.');field.reportValidity();return}
  instructions[matter]=field.value.trim();
  notice=persist()?'Instructions saved in this demo.':'Instructions saved for this session only.';
 }
 workspace();
});
app.addEventListener('change', event => {
 const checkbox = event.target;
 if (!checkbox.matches('input[data-duty]')) return;
 const id = checkbox.dataset.duty;
 const group = dutyGroups.find(item => id.startsWith(item.id + '-'));
 if (!group) return;
 if (checkbox.checked) completedDuties.add(id);
 else completedDuties.delete(id);
 const count = group.duties.filter((_, index) => completedDuties.has(group.id + '-' + index)).length;
 const savedLocally = persist();
 app.querySelector('[data-duty-count="' + group.id + '"]').textContent =
  count + ' of ' + group.duties.length + ' complete' + (savedLocally ? '' : ' · saved for this session only');
});
app.addEventListener('input',event=>{if(event.target instanceof HTMLTextAreaElement)event.target.setCustomValidity('')});
home();
</script>

<script>
(() => {
 const viewport = document.querySelector('#reviews .review-profile-cards');
 if (!viewport || !viewport.firstElementChild) return;
 const marquee = document.createElement('div');
 marquee.className = 'review-marquee';
 const set = document.createElement('div');
 set.className = 'review-marquee-set';
 set.append(...viewport.children);
 const repeat = set.cloneNode(true);
 repeat.setAttribute('inert', '');
 repeat.setAttribute('aria-hidden', 'true');
 marquee.append(set, repeat);
 viewport.append(marquee);
 viewport.dataset.marquee = '';
})();
</script>
